name: ISAAC Instruments
kind: company
description: ISAAC Instruments is a Canadian provider of in-cab technology and fleet
  management for the trucking industry - electronic logging devices (ELD), telematics,
  hours-of-service (HOS) compliance, driver workflow, messaging, and fuel/performance
  analytics, delivered as a fully managed hardware-plus-software platform. ISAAC runs
  an "Open Platform" with a documented API that lets fleets and 80+ integration
  partners (TMS/dispatch, maintenance, fuel tax, visibility, safety/compliance)
  share ISAAC data with their chosen vendors. API access is partner-gated - vendors
  apply through the ISAAC partner program and the full API Guide and reference live
  behind the ISAAC InRealTime portal and Client Center rather than on a public
  developer site. The API surface documented here is modeled from ISAAC's public
  platform and partner materials; exact endpoints, base URLs, and authentication are
  provisioned to approved partners.
